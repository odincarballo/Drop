[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "mediadrop-backend"
version = "0.3.0"
description = "API de análisis de recursos multimedia autorizados"
requires-python = ">=3.13"
dependencies = [
  "aiohttp>=3.12,<4",
  "certifi>=2025.1.31",
  "fastapi>=0.141.1,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx2>=2.12,<3",
  "pytest>=8.3,<10",
  "pytest-asyncio>=1,<2",
  "ruff>=0.11,<1",
  "mypy>=1.15,<2",
  "trustme>=1.2,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
