services:
  - type: web
    name: mediadrop-api
    runtime: docker
    plan: free
    region: ohio
    numInstances: 1
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeployTrigger: "off"
    envVars:
      - key: MEDIADROP_ENVIRONMENT
        value: production
      - key: MEDIADROP_API_TOKEN
        sync: false
      - key: MEDIADROP_ANALYSIS_PROVIDER
        value: auto
      - key: MEDIADROP_ANALYSIS_TIMEOUT_SECONDS
        value: "30"
      - key: MAX_FILE_SIZE
        value: "104857600"
      - key: MAX_INPUT_BYTES
        value: "104857600"
      - key: MAX_OUTPUT_BYTES
        value: "104857600"
      - key: MAX_TEMP_WORK_BYTES
        value: "230686720"
      - key: DOWNLOAD_TIMEOUT
        value: "120"
      - key: CONNECT_TIMEOUT
        value: "10"
      - key: MAX_REDIRECTS
        value: "3"
      - key: MEDIADROP_MAX_MEDIA_DURATION_SECONDS
        value: "600"
      - key: MEDIADROP_MAX_URL_LENGTH
        value: "2048"
      - key: TEMP_FILE_TTL
        value: "3600"
      - key: MEDIADROP_TEMP_CLEANUP_INTERVAL_SECONDS
        value: "60"
      - key: MAX_ACTIVE_JOBS
        value: "2"
      - key: MAX_PROCESSING_JOBS
        value: "1"
      - key: MEDIADROP_MEDIA_PROCESSING_TIMEOUT_SECONDS
        value: "300"
      - key: MEDIADROP_FFMPEG_PATH
        value: ffmpeg
      - key: MEDIADROP_FFPROBE_PATH
        value: ffprobe
      - key: MEDIADROP_YOUTUBE_SOCKET_TIMEOUT_SECONDS
        value: "10"
      - key: MEDIADROP_YOUTUBE_RETRIES
        value: "1"
      - key: MEDIADROP_RATE_LIMIT_REQUESTS
        value: "180"
      - key: MEDIADROP_RATE_LIMIT_WINDOW_SECONDS
        value: "60"
      - key: LOG_LEVEL
        value: INFO
